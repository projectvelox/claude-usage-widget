name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch is allowed but only for the repo owner — this prevents a
  # stranger from triggering a build + publish of an unsigned binary via fork.
  workflow_dispatch:

# Apply the same restriction at job level so even if a future workflow event
# is added, anything that isn't a tag-push or owner-dispatch is rejected.

jobs:
  build-windows:
    # Tag-push always runs. workflow_dispatch only runs for the repo owner.
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "Tag $($tagVersion) does not match package.json version $($pkgVersion). Bump package.json (or use ``npm version`` which does it for you), retag, push."
            exit 1
          }
          Write-Output "OK: tag and package.json both at $pkgVersion"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build icons
        run: npm run icons

      - name: Build portable EXE
        run: npm run build
        env:
          # The packaged EXE itself never sees this var when run by users, but it
          # would cause electron-builder's smoke-test to fail. Strip it for CI too.
          ELECTRON_RUN_AS_NODE: ''

      - name: Build installer EXE
        run: npm run build:installer

      - name: Compute SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -FilePath dist\SHA256SUMS.txt -Encoding ascii
          }
          Get-Content dist\SHA256SUMS.txt

      - name: Extract version (strip leading v)
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          "version=$v" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            **Windows**
            - **`ClaudeUsageWidget-${{ steps.version.outputs.version }}-portable.exe`** — single-file portable. Run anywhere, no install. (Recommended.)
            - **`ClaudeUsageWidget-${{ steps.version.outputs.version }}-setup.exe`** — one-click installer for `%LOCALAPPDATA%`.

            **Linux**
            - **`ClaudeUsageWidget-${{ steps.version.outputs.version }}-x86_64.AppImage`** — Linux x86_64. `chmod +x` and double-click to run.

            Verify with `SHA256SUMS.txt` (Windows) or `SHA256SUMS-linux.txt` (Linux).

            > **First-launch note for Windows:** the EXE is unsigned, so SmartScreen will show "Windows protected your PC." Click **More info → Run anyway**. We're applying for free OSS code signing; until that lands, this is a one-time click per machine.
            >
            > **Linux is a first tester build.** Everything should work but the settings label still reads "Start with Windows" instead of "Start on login"; report issues on the tracker.

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  build-linux:
    # Tag-push always runs. workflow_dispatch only runs for the repo owner.
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag_version does not match package.json version $pkg_version." >&2
            exit 1
          fi
          echo "OK: tag and package.json both at $pkg_version"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build icons
        run: npm run icons

      - name: Build AppImage
        run: npm run build:linux
        env:
          # Same reason as the Windows job: strip so the packaged binary's
          # smoke-test doesn't run under Node.js mode.
          ELECTRON_RUN_AS_NODE: ''

      - name: Compute SHA-256 sums
        run: |
          cd dist
          for f in *.AppImage; do
            sha256sum "$f" >> SHA256SUMS-linux.txt
          done
          cat SHA256SUMS-linux.txt

      - name: Extract version (strip leading v)
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
          fail_on_unmatched_files: true

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
